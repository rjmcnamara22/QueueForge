name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: queueforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d queueforge_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/queueforge_test
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/queueforge_test
          REDIS_URL: redis://localhost:6379/0
        run: pytest

      - name: Run Ruff
        run: ruff check .

      - name: Run mypy
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/queueforge_test
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/queueforge_test
          REDIS_URL: redis://localhost:6379/0
        run: mypy app tests
