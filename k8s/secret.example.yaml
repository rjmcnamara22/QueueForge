apiVersion: v1
kind: Secret
metadata:
  name: queueforge-secrets
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: your_postgres_password
  POSTGRES_DB: queueforge
  DATABASE_URL: postgresql+psycopg://postgres:your_postgres_password@postgres:5432/queueforge
  TEST_DATABASE_URL: postgresql+psycopg://postgres:your_postgres_password@postgres:5432/queueforge_test
