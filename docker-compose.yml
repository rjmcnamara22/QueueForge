services:
  redis:
    image: redis:7-alpine
    container_name: queueforge-redis
    ports:
      - "6379:6379"

  api:
    build: .
    container_name: queueforge-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL}
      TEST_DATABASE_URL: ${DOCKER_TEST_DATABASE_URL}
      REDIS_URL: ${DOCKER_REDIS_URL}
    depends_on:
      - redis

  worker:
    build: .
    container_name: queueforge-worker
    command: celery -A app.celery_app.celery_app worker --loglevel=info
    volumes:
      - .:/app
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL}
      TEST_DATABASE_URL: ${DOCKER_TEST_DATABASE_URL}
      REDIS_URL: ${DOCKER_REDIS_URL}
    depends_on:
      - redis
